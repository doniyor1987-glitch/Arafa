ight:1.55;margin-top:13px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}.history-row:last-child{border:0}.history-title{font-size:13px;font-weight:700}.history-sub{font-size:11px;color:var(--muted);margin-top:4px}.amount{font-size:14px;font-weight:780;white-space:nowrap}.amount.add{color:#996b30}.amount.done{color:#17815b}.muted{text-align:center;color:var(--muted);font-size:13px;padding:20px}.small{font-size:12px}.toolbar{display:flex;gap:9px}.toolbar .big-btn{margin-top:5px}.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,700px);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e0e8de;padding:10px 9px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 25px rgba(25,45,32,.04)}.nav button{border:0;background:transparent;display:flex;flex-direction:column;gap:5px;align-items:center;color:#8b9a90;font-size:11px;padding:7px 4px;border-radius:12px}.nav button strong{font-size:19px;line-height:1}.nav button.active{background:#edf4eb;color:#1e614d;font-weight:750}.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-stats .card{margin:0}.metric{font-size:24px;font-weight:750;margin-top:9px}.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.setup-field{border:1px solid var(--line);border-radius:12px;padding:12px}.setup-field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.setup-field input{width:100%;height:41px;border:1px solid #ccd9ce;border-radius:9px;padding:0 9px;font-size:16px}.status{font-size:12px;color:#2e7156;margin:12px 2px 0;min-height:18px}a{color:var(--green)}@media(min-width:600px){.prayer-list{grid-template-columns:repeat(3,minmax(0,1fr))}.app-shell{padding-left:25px;padding-right:25px}}

<body>
  <div id="app" class="app-shell"></div>
  <noscript>Ilovadan foydalanish uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>
  <script>
/* Qazo namozlarim hisobi — account-free, offline-first PWA. No data is sent to a server. */
'use strict';
const KEY = 'qazo_hisobim_local_v1';
const PRAYERS = [
  {id:'bomdod',name:'Bomdod',rakat:2},
  {id:'peshin',name:'Peshin',rakat:4},
  {id:'asr',name:'Asr',rakat:4},
  {id:'shom',name:'Shom',rakat:3},
  {id:'xufton',name:'Xufton',rakat:4},
  {id:'vitr',name:'Vitr',rakat:3}
];
const IDS = PRAYERS.map(x=>x.id);
const blank = () => Object.fromEntries(IDS.map(k=>[k,0]));
const newState = () => ({version:1,actions:[]});
let state = (()=>{try {const raw=localStorage.getItem(KEY); if(!raw)return newState(); const s=JSON.parse(raw); if(validate(s))return s;}catch(_){} return newState();})();
let tab='home', kind='debt', selected='all', years='5', statusText='';
const $ = id => document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('en-US');
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const nowLocalDate=()=>localDate();
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0);}
function evaluate(s){
  const debt=blank(),done=blank();
  for(const a of s.actions){
    const target=a.type==='debt'?debt:done;
    for(const [key,value] of Object.entries(a.delta))target[key]+=value;
    if(IDS.some(k=>done[k]<0||debt[k]<0||done[k]>debt[k]))throw new Error('Hisob mos emas');
  }
  return {debt,done,remaining:Object.fromEntries(IDS.map(k=>[k,debt[k]-done[k]])),total:sum(debt),completed:sum(done)};
}
function validate(s){
  if(!s||s.version!==1||!Array.isArray(s.actions)||s.actions.length>100000)return false;
  for(const a of s.actions){
    if(!['debt','done'].includes(a.type)||typeof a.at!=='string'||!Number.isFinite(Date.parse(a.at))||!a.delta||typeof a.delta!=='object'||Array.isArray(a.delta))return false;
    const entries=Object.entries(a.delta);
    if(entries.length<1||entries.length>6)return false;
    if(entries.some(([k,v])=>!IDS.includes(k)||!Number.isSafeInteger(v)||Math.abs(v)>10000000||v===0))return false;
  }
  try {evaluate(s);return true;} catch(_){return false;}
}
function commit(next,notice){
  if(!validate(next)){alert('Kiritilgan qiymat qoldiqdan oshib ketdi yoki noto‘g‘ri.');return false;}
  try {localStorage.setItem(KEY,JSON.stringify(next));}catch(_){alert('Ma’lumotni saqlab bo‘lmadi. Telefon xotirasini tekshiring.');return false;}
  state=next;statusText=notice||'Saqlandi';render();return true;
}
function record(type,delta,note){
  return commit({...state,actions:[...state.actions,{type,delta,at:new Date().toISOString(),note:note||''}]},'Hisob saqlandi');
}
function actionName(a){const p=Object.keys(a.delta);return p.length===6?'Barcha namozlar':p.map(k=>PRAYERS.find(x=>x.id===k)?.name||k).join(', ');}
function timeLabel(iso){return new Date(iso).toLocaleString('uz-UZ',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function recentToday(){return state.actions.filter(a=>a.type==='done'&&localDate(new Date(a.at))===nowLocalDate()).reduce((acc,a)=>acc+sum(a.delta),0);}
function hero(count){const remaining=count.total-count.completed,p=count.total?Math.min(100,100*count.completed/count.total):0;return `<div class="hero"><div class="hero-eyebrow">QOLGAN QAZO NAMOZLAR</div><h1>${fmt(remaining)} <small>ta</small></h1><div class="hero-sub">Har bir qazo namozingiz qayd etiladi</div><div class="progress"><div style="width:${p.toFixed(2)}%"></div></div><div class="hero-stats"><span>Jami <strong>${fmt(count.total)}</strong></span><span>O‘qilgan <strong>${fmt(count.completed)}</strong></span><span><strong>${Math.round(p)}%</strong> bajarildi</span></div></div>`;}
function rozaDashboard(){
 const remaining=Math.max(0,roza.debt-roza.done);
 if(roza.debt===0)return `<div class="card roza-dashboard"><div class="roza-dashboard-head"><h3>🌙 Ro‘za hisobim</h3><span>Hali hisob kiritilmagan</span></div><p>Qazo ro‘za kunlaringizni kiritsangiz, tugatish rejasi shu yerda ko‘rinadi.</p><button class="big-btn secondary" data-act="goRoza">Ro‘zani hisoblash →</button></div>`;
 return `<div class="card roza-dashboard"><div class="roza-dashboard-head"><h3>🌙 Ro‘za rejasi</h3><span>${fmt(roza.done)} kun tutilgan</span></div><div class="roza-dashboard-total"><strong>${fmt(remaining)} kun</strong><small>qoldi · jami ${fmt(roza.debt)} kun</small></div>
 ${remaining>0?rozaPlans(remaining):'<p class="caption">Barcha qazo ro‘zalar ado etilgan deb belgilangan.</p>'}
 <button class="big-btn secondary" data-act="goRoza">Ro‘za hisobini boshqarish →</button></div>`;
}
function home(count){
  return `${hero(count)}${count.total===0?'<div class="warning">Boshlash uchun <b>Hisob</b> bo‘limida dastlabki qazo miqdorini kiriting. 12–39 yoshning hammasini avtomatik qazo deb olmang.</div>':''}
  <div class="section-head"><h2>Namozlar</h2><span>+1 o‘qildi / −1 bekor</span></div>
  <div class="prayer-list">${PRAYERS.map(p=>`<article class="prayer"><div class="prayer-top"><div><div class="prayer-name">${p.name}</div><div class="prayer-rakat">${p.rakat} rakat</div></div><span style="color:#b5aa7f">✦</span></div><div class="prayer-count">${fmt(count.remaining[p.id])} <span>qoldi</span></div><div class="btn-row"><button class="circle-btn" aria-label="${p.name} oxirgi belgilangan bittani bekor qilish" data-act="sub" data-prayer="${p.id}" ${count.done[p.id]===0?'disabled':''}>−</button><span class="done-count">${fmt(count.done[p.id])} o‘qilgan</span><button class="circle-btn plus" aria-label="${p.name}dan bittasi o‘qildi" data-act="plus" data-prayer="${p.id}" ${count.remaining[p.id]===0?'disabled':''}>+</button></div></article>`).join('')}</div>
  <div class="section-head"><h2>Bugungi natija</h2></div><div class="mini-stats"><div class="card"><div class="caption">Bugun o‘qilgan</div><div class="metric">${fmt(recentToday())}</div></div><div class="card"><div class="caption">Jami ado etilgan</div><div class="metric">${fmt(count.completed)}</div></div></div>
  ${rozaDashboard()}
  <button class="big-btn secondary" data-act="navigate" data-tab="manage">Qazoni hisoblash →</button>`;
}

function periodActions(){return state.actions.filter(a=>a.type==='debt'&&typeof a.note==='string'&&/^DAVR\|\d{4}-\d{2}-\d{2}\|\d{4}-\d{2}-\d{2}\|/.test(a.note));}
function parseCalendarDate(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
 const ms=Date.parse(s+'T00:00:00Z');if(!Number.isFinite(ms)||new Date(ms).toISOString().slice(0,10)!==s)return null;return ms;
}
function historyPeriods(){
 const rows=periodActions().map(a=>{const parts=a.note.split('|');return {start:parts[1],end:parts[2],delta:a.delta};});
 return rows.sort((a,b)=>a.start.localeCompare(b.start));
}
function periodView(){
 const existing=historyPeriods();
 return `<div class="card" id="namozTarixim"><h3>Namoz tarixim — sanalar bo‘yicha</h3>
 <p>O‘qilgan va qoldirilgan davrlarni alohida kiriting. Har bir namoz turi uchun <b>qoldirilgan taxminiy foizni</b> belgilang. Qazo bo‘lmagan namozga 0%, to‘liq qoldirilganiga 100% kiriting.</p>
 <div class="period-grid"><div class="field"><label for="periodStart">Boshlanish sanasi</label><input type="date" id="periodStart" min="1900-01-01"></div><div class="field"><label for="periodEnd">Tugash sanasi (shu kun ham kiradi)</label><input type="date" id="periodEnd" min="1900-01-01"></div></div>
 <div class="period-pct">${PRAYERS.map(p=>`<div><label for="period-${p.id}">${p.name} — qoldirilgan %</label><input type="number" id="period-${p.id}" value="100" min="0" max="100" step="1" inputmode="numeric"></div>`).join('')}</div>

let calcType='namoz',calcMode='year',calcPreview=null,missedMode='all';
const ROZA_KEY='arafa_roza_v1';
function readRoza(){try{const x=JSON.parse(localStorage.getItem(ROZA_KEY));if(x&&Number.isSafeInteger(x.debt)&&Number.isSafeInteger(x.done)&&x.debt>=x.done&&x.done>=0)return x;}catch(e){}return {debt:0,done:0};}
let roza=readRoza();
let rozaDraft={startYear:roza.startYear||'',endYear:roza.endYear||''};
function calcDays(a,b){const x=Date.parse(a+'T00:00:00Z'),y=Date.parse(b+'T00:00:00Z');if(!Number.isFinite(x)||!Number.isFinite(y)||new Date(x).toISOString().slice(0,10)!==a||new Date(y).toISOString().slice(0,10)!==b||y<=x||y>Date.now())return null;return Math.round((y-x)/86400000);}
function safeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rozaDuration(days){
 if(days<=0)return "Tugallangan";
 const years=Math.floor(days/365),afterYears=days-years*365,months=Math.floor(afterYears/30),rest=afterYears-months*30;
 return [years?years+" yil":"",months?months+" oy":"",rest?rest+" kun":""].filter(Boolean).join(" ");
}
function rozaPlans(remaining){
 const entries=[["Har kuni",remaining],["Haftasiga 3 kun",Math.ceil(remaining/3)*7],["Dushanba va payshanba",Math.ceil(remaining/2)*7]];
 return `<div class="roza-plan"><h3>Qancha vaqtda tugatasiz?</h3><div class="roza-plan-grid">${entries.map(([label,days])=>`<div class="roza-plan-card"><strong>${label}</strong><div class="roza-plan-number">${rozaDuration(days)}</div><small>≈ ${fmt(days)} kun ichida</small></div>`).join('')}</div><p class="caption">Muddatlar taxminiy. Ro‘za tutish mumkin bo‘lmagan kunlar va tanaffuslar hisobga olinmagan.</p></div>`;
}
function rozaManage(){
 const latest=calcPreview&&calcPreview.type==='roza'?calcPreview:null;
 const saved=!latest&&Number.isSafeInteger(roza.startYear)&&Number.isSafeInteger(roza.endYear)&&roza.endYear>=roza.startYear?{amount:roza.debt,startYear:roza.startYear,endYear:roza.endYear}:null;
 const result=latest||saved;
 const tabs=`<div class="section-head"><h2>Qazoni hisoblash</h2><span>Hanafiy mazhabi</span></div><div class="calc-choose"><button data-act="calcType" data-value="namoz">🕌<b>Namoz</b><small>Qazo namozlar</small></button><button class="chosen" data-act="calcType" data-value="roza">🌙<b>Ro‘za</b><small>Qazo ro‘zalar</small></button></div>`;
 return `${tabs}
 <div class="card">
 <h3>Qazo ro‘zalarni hisoblash</h3>
 <div class="roza-year-grid"><div class="field"><label for="rozaStartYear">Balog‘atga yetgan yilingiz</label><input id="rozaStartYear" type="number" inputmode="numeric" min="1900" max="2100" step="1" placeholder="Masalan, 2018" value="${safeHTML(rozaDraft.startYear)}"></div>
 <div class="field"><label for="rozaEndYear">Ro‘za tutmagan oxirgi yil</label><input id="rozaEndYear" type="number" inputmode="numeric" min="1900" max="2100" step="1" placeholder="Masalan, 2026" value="${safeHTML(rozaDraft.endYear)}"></div></div>
 <p class="caption">Boshlanish va tugash yillari ham hisobga kiradi. Masalan, 2018–2026 = 9 ta Ramazon.</p>
 <button class="big-btn" data-act="rozaRun">Qazo ro‘zani hisoblash →</button>
 </div>
 ${result?`<div class="card roza-result">
 <div class="roza-big"><div class="roza-name">Qazo ro‘za hisobingiz</div><span>JAMI QAZO RO‘ZA</span><strong>${fmt(result.amount)}</strong><b>KUN RO‘ZA</b></div>
 <div class="roza-detail"><div><span>Davr</span><strong>${result.startYear} — ${result.endYear}</strong></div><div><span>Ramazon oylari</span><strong>${fmt(result.endYear-result.startYear+1)} ta</strong></div><div><span>Hisob</span><strong>${fmt(result.endYear-result.startYear+1)} × 30 = ${fmt(result.amount)} kun</strong></div></div>
 <div class="warning">Har bir Ramazon <b>30 kun</b> deb olingan taxminiy hisob. Asl Ramazon 29 yoki 30 kun bo‘ladi. Bu natija barcha Ramazon kunlari tutilmagan deb hisoblaydi; ilgari tutilgan kunlarni inobatga oling.</div>
 ${latest?'<button class="big-btn" data-act="rozaSave">Natijani hisobimga saqlash</button>':'<p class="caption">Bu hisob telefoningizda saqlangan.</p>'}
 </div>`:''}
 <div class="card"><h3>Ro‘za hisobim</h3><p>Jami: ${fmt(roza.debt)} · Tutilgan: ${fmt(roza.done)} · Qolgan: <b>${fmt(roza.debt-roza.done)} kun</b></p>
 <div class="calc-roza-actions"><button data-act="rozaMinus" aria-label="Ro‘zani bekor qilish" ${roza.done===0?'disabled':''}>−</button><b>${fmt(roza.done)} tutilgan</b><button data-act="rozaPlus" aria-label="Tutilgan ro‘zani belgilash" ${roza.done===roza.debt?'disabled':''}>+</button></div></div>`;
}
function manage(count){
 if(calcType==='roza')return rozaManage();
 const result=calcPreview&&calcPreview.type==='namoz'&&calcPreview.mode===calcMode?calcPreview:null;
 return `<div class="section-head"><h2>Qazoni hisoblash</h2><span>Hanafiy mazhabi</span></div>
 <div class="calc-choose"><button class="chosen" data-act="calcType" data-value="namoz">🕌<b>Namoz</b><small>Qazo namozlar</small></button><button data-act="calcType" data-value="roza">🌙<b>Ro‘za</b><small>Qazo ro‘zalar</small></button></div>
 <div class="card">
 <div class="calc-toggle"><button class="${calcMode==='year'?'chosen':''}" data-act="calcMode" data-value="year">Yil bo‘yicha</button><button class="${calcMode==='date'?'chosen':''}" data-act="calcMode" data-value="date">Sana bo‘yicha</button></div>
 ${calcMode==='year'?`<div class="field"><label for="calcYears">Qazo davri necha yil?</label><input id="calcYears" type="number" min="0.5" max="100" step="0.5" placeholder="Masalan, 5" inputmode="decimal" value="${result?.yearInput||''}"></div>`:`<div class="field"><label for="calcFrom">Davr boshlangan sana</label><input id="calcFrom" type="date" value="${result?.from||''}"></div><div class="field"><label for="calcTo">Davr tugagan sana (shu kun ham hisoblanadi)</label><input id="calcTo" type="date" value="${result?.to||''}"></div>`}
 <div class="field"><label>Bu davrda qaysi namozlarni qoldirgansiz?</label><div class="calc-toggle"><button data-act="missedMode" data-value="all" class="${missedMode==='all'?'chosen':''}">Hammasini</button><button data-act="missedMode" data-value="partial" class="${missedMode==='partial'?'chosen':''}">Ba’zilarini</button></div></div>
 ${missedMode==='partial'?`<p class="caption">Har bir namozdan necha foizini qoldirgansiz? 0% — o‘qilgan, 100% — umuman o‘qilmagan. Har birini alohida kiriting.</p>
 <div class="missed-pct-grid">${PRAYERS.map(p=>`<div class="missed-pct"><label for="pct-${p.id}">${p.name}</label><div><input id="pct-${p.id}" type="number" inputmode="numeric" min="0" max="100" step="1" placeholder="0–100" value="${result?.percents?.[p.id]??''}"><span>%</span></div></div>`).join('')}</div>`:
 '<p class="caption">Tanlangan davrning har kuni 5 vaqt farz va vitr qazo bo‘lgan deb hisoblanadi.</p>'}
 <button class="big-btn" data-act="calcRun">Hisoblash</button>
 ${result?`<div class="calc-result">
 <div class="calc-result-total"><span>Hisoblangan qazo</span><strong>${fmt(sum(result.amounts))} ta</strong></div>
 <div class="calc-result-breakdown">${PRAYERS.map(p=>`<div><span>${p.name}</span><b>${fmt(result.amounts[p.id])} ta</b></div>`).join('')}</div>
 <p class="caption">${fmt(result.days)} kunlik davr asosida hisoblangan. Bu taxmin; ilgari o‘qilgan namozlaringizni ham hisobga oling.</p>
 <div class="field"><label for="calcSaveMethod">Natijani qanday saqlaymiz?</label><select id="calcSaveMethod"><option value="add">Shu davrni hisobga qo‘shish</option><option value="replace">Jami qazo hisobini shu natijaga almashtirish</option></select></div>
 <div class="warning">Bir davrni ikki marta qo‘shmang. Oldin ado etilgan qazo qaydlari saqlanadi.</div>
 <button class="big-btn" data-act="calcSave">Hisobimga saqlash</button>
 </div>`:''}
 </div>
 <div class="card"><h3>Hozirgi namoz hisobim</h3><p>Jami: <b>${fmt(count.total)}</b> · O‘qilgan: <b>${fmt(count.completed)}</b> · Qolgan: <b>${fmt(count.total-count.completed)}</b></p>
 <button class="big-btn secondary" data-act="navigate" data-tab="home">Dashboardga qaytish →</button></div>`;
}
function history(){const rows=[...state.actions].reverse();return `<div class="section-head"><h2>Harakatlar tarixi</h2><span>${fmt(rows.length)} ta yozuv</span></div><div class="card">${rows.length?rows.slice(0,150).map(a=>`<div class="history-row"><div><div class="history-title">${a.type==='debt'?'Hisobga qo‘shildi / tuzatildi':'O‘qildi / tuzatildi'} · ${actionName(a)}</div><div class="history-sub">${timeLabel(a.at)}</div></div><div class="amount ${a.type==='debt'?'add':'done'}">${sum(a.delta)>0?'+':''}${fmt(sum(a.delta))}</div></div>`).join(''):'<div class="muted">Hozircha yozuv yo‘q.</div>'}</div><button class="big-btn secondary" data-act="undo" ${!rows.length?'disabled':''}>Oxirgi amalni bekor qilish</button><p class="caption">Xato kiritilgan oxirgi amalga qaytishingiz mumkin. Boshqa amalni tuzatish uchun Hisob bo‘limidan foydalaning.</p>`;}
function settings(count){return `<div class="section-head"><h2>Sozlamalar va zaxira</h2></div>
 <div class="card"><h3>Maxfiylik</h3><p>Akkaunt yo‘q. Hisoblar faqat shu qurilmadagi ilova xotirasida turadi. Serverga yuborilmaydi. Boshqa odam ilovani ochsa, uning hisobi noldan boshlanadi.</p><div class="warning">iPhone xotirasi tozalansa yoki ilova ma’lumotlari o‘chirilsa, hisob yo‘qolishi mumkin. Muntazam <b>zaxira nusxa</b> saqlang.</div></div>
 <div class="card"><h3>Zaxira nusxa</h3><p>JSON faylni iPhone’ning Files dasturida saqlashingiz yoki boshqa telefoningizga ko‘chirishingiz mumkin. Zaxira faylni ommaga yubormang.</p><button class="big-btn" data-act="export">Zaxira nusxani yuklab olish</button><label class="big-btn secondary" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Zaxiradan tiklash<input id="backupInput" type="file" accept=".json,application/json" hidden></label></div>
 <div class="card"><h3>Ma’lumotlarni tozalash</h3><p>Jami ${fmt(count.total)} ta boshlang‘ich qazo, ${fmt(count.completed)} ta ado etilgan qazo qaydi mavjud.</p><button class="big-btn danger" data-act="reset">Barcha hisoblarni o‘chirish</button></div>`;}
function render(){const count=evaluate(state);$('app').innerHTML=`<div class="arafa-bar"><a href="./" aria-label="Arafa zikr va duolar sahifasiga qaytish">← Arafa · Zikr va duolar</a><span>Shaxsiy hisob</span></div><header class="topbar"><div class="brand"><div class="emblem">☾</div><div><div class="eyebrow">Hanafiy · Qazo namozlari</div><strong>Qazo namozlarim hisobi</strong></div></div><span class="pill">☘ Akkauntsiz</span></header><main>${tab==='home'?home(count):tab==='manage'?manage(count):tab==='history'?history():settings(count)}</main><div class="status" role="status">${statusText}</div><nav class="nav" aria-label="Asosiy menyu">${[['home','⌂','Asosiy'],['manage','⊕','Hisob'],['history','◷','Tarix'],['settings','⚙','Sozlama']].map(([t,ico,label])=>`<button data-act="navigate" data-tab="${t}" class="${tab===t?'active':''}" ${tab===t?'aria-current="page"':''}><strong>${ico}</strong><span>${label}</span></button>`).join('')}</nav>`;}
function ensureAction(type,keys,n){const count=evaluate(state);if(!Number.isSafeInteger(n)||n<=0||n>10000000){alert('1 dan 10 milliongacha butun son kiriting.');return;}
  if(type==='done'&&keys.some(k=>count.remaining[k]<n)){alert('Tanlangan namoz uchun qazo qoldig‘i yetarli emas. Oldin hisobga qo‘shing.');return;}
  if(n>=365&&type==='done'&&!confirm(`DIQQAT: ${keys.length} ta namoz turining HAR BIRIDAN ${fmt(n)} tadan qazo haqiqatan o‘qildimi?`))return;
  if(n>=365&&type==='debt'&&!confirm(`Har bir tanlangan namoz turiga ${fmt(n)} tadan qazo qo‘shilsinmi?`))return;
  record(type,Object.fromEntries(keys.map(k=>[k,n])));
}
function handleNamozAction(act,b){
 if(act==='missedMode'){missedMode=b.dataset.value;calcPreview=null;render();return true;}
 if(act==='calcRun'){
   if(calcType!=='namoz')return false;
   let days=null,from=null,to=null,yearInput='',percents={};
   if(calcMode==='year'){
     yearInput=$('calcYears').value.trim();const val=Number(yearInput);
     if(!Number.isFinite(val)||val<=0||val>100){alert('0 dan katta va 100 yildan oshmagan davr kiriting.');return true;}
     days=Math.round(val*365.2425);
   }else{
     from=$('calcFrom').value;to=$('calcTo').value;
     const a=parseCalendarDate(from),z=parseCalendarDate(to);
     if(a===null||z===null||z<a||to>nowLocalDate()){alert('Boshlanish va tugash sanalarini to‘g‘ri kiriting (kelajakdagi sanalar mumkin emas).');return true;}
     days=Math.round((z-a)/86400000)+1;
   }
   if(!Number.isSafeInteger(days)||days<1){alert('Qazo davri noto‘g‘ri.');return true;}
   const amounts={};
   for(const p of PRAYERS){
     if(missedMode==='all'){amounts[p.id]=days;continue;}
     const input=$('pct-'+p.id),raw=(input&&input.value||'').trim(),n=Number(raw);
     if(!raw||!Number.isSafeInteger(n)||n<0||n>100){alert(p.name+' uchun qoldirilgan ulushni 0 dan 100 gacha kiriting.');if(input)input.focus();return true;}
     percents[p.id]=n;amounts[p.id]=Math.round(days*n/100);
   }
   calcPreview={type:'namoz',mode:calcMode,days,from,to,amounts,yearInput,percents};render();return true;
 }
 if(act==='calcSave'){
   const v=calcPreview;
   if(!v||v.type!=='namoz'||v.mode!==calcMode)return true;
   const method=$('calcSaveMethod')&&$('calcSaveMethod').value;
   if(method!=='add'&&method!=='replace')return true;
   const current=evaluate(state),delta={};
   if(method==='add'){
     if(v.mode==='date'&&historyPeriods().some(p=>!(v.to<p.start||v.from>p.end))){alert('Bu sanalar ilgari hisobga qo‘shilgan davr bilan kesishadi. Bir davrni ikki marta qo‘shmang.');return true;}
     for(const p of PRAYERS)if(v.amounts[p.id]>0)delta[p.id]=v.amounts[p.id];
     if(Object.keys(delta).length===0){alert('Bu davr uchun qazo namoz soni nol.');return true;}
     if(!confirm('Hisobga '+fmt(sum(delta))+' ta qazo namoz QO‘SHILADI. Bu davr oldin kiritilmaganmi?'))return true;
   }else{
     for(const p of PRAYERS){
       if(v.amounts[p.id]<current.done[p.id]){alert(p.name+'ning hisoblangan miqdori ilgari ado etilganidan kam. Hisobni almashtirib bo‘lmaydi.');return true;}
       const diff=v.amounts[p.id]-current.debt[p.id];if(diff!==0)delta[p.id]=diff;
     }
     if(Object.keys(delta).length===0){calcPreview=null;statusText='Jami qazo o‘zgarmadi';render();return true;}
     if(!confirm('JAMI qazo hisobi yangi hisoblangan miqdorga ALMASHTIRILADI. Oldingi ado yozuvlari saqlanadi. Davom etamizmi?'))return true;
   }
   const note=method==='add'&&v.mode==='date'?'DAVR|'+v.from+'|'+v.to+'|Qazo hisoblandi':method==='replace'?'Kalkulyator orqali jami qayta hisoblandi':'Yil bo‘yicha davr qo‘shildi';
   if(record('debt',delta,note)){calcPreview=null;statusText='Qazo hisobi saqlandi';render();}
   return true;
 }
 return false;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-act],button[data-kind],button[data-year]');if(!b)return;
 if(b.dataset.kind){kind=b.dataset.kind;statusText='';render();return;}
 if(b.dataset.year){selected=$('choosePrayer')?.value||selected;years=b.dataset.year;statusText='';render();return;}
 const act=b.dataset.act,p=b.dataset.prayer;
 if(act==='navigate'){tab=b.dataset.tab;statusText='';render();window.scrollTo(0,0);}
 if(act==='goRoza'){tab='manage';calcType='roza';calcPreview=null;render();window.scrollTo(0,0);return;}
 if(act==='calcType'){calcType=b.dataset.value;calcPreview=null;render();return;}
 if(act==='calcMode'){calcMode=b.dataset.value;calcPreview=null;render();return;}

 if(act==='rozaRun'){
   const startText=$('rozaStartYear').value.trim(),endText=$('rozaEndYear').value.trim();
   const start=Number(startText),end=Number(endText),current=new Date().getFullYear();
   if(!/^\d{4}$/.test(startText)||!/^\d{4}$/.test(endText)||!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<1900||end>current||start>end||end-start>100){
     alert('Yillarni to‘g‘ri kiriting: balog‘at yili oxirgi yilga teng yoki undan oldin bo‘lishi kerak.');return;
   }
   rozaDraft={startYear:start,endYear:end};
   calcPreview={type:'roza',mode:'years',amount:(end-start+1)*30,startYear:start,endYear:end};
   render();return;
 }
 if(act==='rozaSave'){
   if(!calcPreview||calcPreview.type!=='roza')return;
   const v=calcPreview;
   if(v.amount<roza.done){alert('Yangi jami qazo ilgari tutilgan ro‘za sonidan kam.');return;}
   if(!confirm('Hisobdagi jami ro‘za soni '+fmt(v.amount)+' kunga almashtirilsinmi? Oldin belgilangan tutilgan ro‘zalar saqlanadi.'))return;
   const {name:oldName,...rozaWithoutName}=roza;
   const next={...rozaWithoutName,debt:v.amount,startYear:v.startYear,endYear:v.endYear};
   try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;calcPreview=null;statusText='Ro‘za hisobi saqlandi';render();}
   catch(e){alert('Ro‘za hisobini saqlashda xatolik yuz berdi.');}
   return;
 }
 if(handleNamozAction(act,b))return;
 if(act==='calcRun'){
   let amount=0;
   if(calcMode==='year'){
     const val=Number($('calcYears').value);
     if(!Number.isFinite(val)||val<=0||val>100){alert('0 dan katta va 100 yildan oshmagan yil kiriting.');return;}
     amount=Math.round(val*(calcType==='namoz'?365.2425:29.5));
   }else{
     const days=calcDays($('calcFrom').value,$('calcTo').value);
     if(days===null){alert('To‘g‘ri sanalarni kiriting.');return;}
     amount=calcType==='namoz'?days:Math.round(days/354.367*29.5);
   }
   if(amount<=0){alert('Hisob natijasi nol.');return;}
   calcPreview={type:calcType,mode:calcMode,amount};render();return;
 }
 if(act==='calcSave'){
   if(!calcPreview||calcPreview.type!==calcType||calcPreview.mode!==calcMode)return;
   if(!confirm('Hisoblangan miqdor joriy JAMI qazo sonini almashtiradi. Oldin qayd etilgan ado amallari saqlanadi. Davom etamizmi?'))return;
   if(calcType==='namoz'){
     const c=evaluate(state),delta={};
     for(const p of PRAYERS){if(calcPreview.amount<c.done[p.id]){alert(p.name+' uchun oldin ado etilgan miqdor yangi hisobdan ko‘p.');return;}const d=calcPreview.amount-c.debt[p.id];if(d!==0)delta[p.id]=d;}
     if(Object.keys(delta).length&&!record('debt',delta,'Kalkulyator bilan yangilandi'))return;
   }else{
     if(calcPreview.amount<roza.done){alert('Tutilgan ro‘za miqdoridan kam hisob saqlanmaydi.');return;}
     const next={...roza,debt:calcPreview.amount};
     try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;}catch(e){alert('Saqlash amalga oshmadi.');return;}
   }
   calcPreview=null;statusText='Hisob saqlandi';render();return;
 }
 if(act==='rozaPlus'||act==='rozaMinus'){
   const newDone=roza.done+(act==='rozaPlus'?1:-1);
   if(newDone<0||newDone>roza.debt)return;
   const next={...roza,done:newDone};
   try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;statusText='Saqlandi';render();}catch(e){alert('Saqlash amalga oshmadi.')}
   return;
 }
 if(act==='plus')ensureAction('done',[p],1);
 if(act==='sub'){const c=evaluate(state);if(c.done[p]>0)record('done',{[p]:-1});}
 if(act==='bulk'){selected=$('choosePrayer').value;const q=Number($('bulkQuantity').value);ensureAction(kind,selected==='all'?IDS:[selected],q);}
 if(act==='addPeriod'){
   const start=$('periodStart').value,end=$('periodEnd').value;
   const a=parseCalendarDate(start),b=parseCalendarDate(end);
   if(a===null||b===null||b<a||b>Date.now()||((b-a)/86400000)>36525){alert('To‘g‘ri, o‘tib ketgan sanalar oralig‘ini kiriting (100 yildan oshmasin).');return;}
   if(historyPeriods().some(p=>!(end<p.start||start>p.end))){alert('Bu davr oldin hisoblangan sana bilan kesishadi. Bir davrni qayta qo‘shmang.');return;}
   const days=Math.round((b-a)/86400000)+1,delta={};
   for(const p of PRAYERS){const n=Number($('period-'+p.id).value);if(!Number.isSafeInteger(n)||n<0||n>100){alert('Har bir namoz uchun 0 dan 100 gacha butun foiz yozing.');return;}const estimate=Math.round(days*n/100);if(estimate>0)delta[p.id]=estimate;}
   if(Object.keys(delta).length===0){alert('Barcha foizlar 0: qo‘shiladigan qazo yo‘q.');return;}
   if(confirm(start+' dan '+end+' gacha ('+days+' kun) bo‘yicha taxminiy qazolarni hisobga qo‘shasizmi?'))record('debt',delta,'DAVR|'+start+'|'+end+'|'+days+' kun');
 }
 if(act==='ageEstimate'){
   const from=Number($('ageFrom').value),to=Number($('ageTo').value),pct=Number($('missedPct').value);
   if(!Number.isFinite(from)||!Number.isFinite(to)||!Number.isFinite(pct)||from<1||to>120||to<=from||pct<0||pct>100){alert('Yoshlar oralig‘i va 0–100% ulushni to‘g‘ri kiriting.');return;}
   const number=Math.round((to-from)*365.2425*pct/100);
   if(number<1){alert('Bu davr uchun qazo miqdori 0 ga teng.');return;}
   if(confirm(`${from}–${to} yosh davri uchun 6 turdagi namozning har biriga ${fmt(number)} ta taxminiy qazo qo‘shilsinmi?`))record('debt',Object.fromEntries(IDS.map(id=>[id,number])),`${from}–${to} yosh · ${pct}%`);
 }
 if(act==='manual'){
   const c=evaluate(state),delta={};let bad=false;
   for(const p of PRAYERS){const v=Number($('set-'+p.id).value);if(!Number.isSafeInteger(v)||v<0||v>10000000||v<c.done[p.id]){bad=true;break;}const diff=v-c.debt[p.id];if(diff!==0)delta[p.id]=diff;}
   if(bad){alert('Jami qazo o‘qilgan miqdordan kam bo‘lmasligi va musbat butun son bo‘lishi kerak.');return;}
   if(Object.keys(delta).length===0){statusText='O‘zgarish yo‘q';render();return;}
   if(confirm('Boshlang‘ich qazo miqdorlarini yangilaysizmi?'))record('debt',delta);
 }
 if(act==='undo'){if(state.actions.length&&confirm('Oxirgi amal bekor qilinsinmi?'))commit({...state,actions:state.actions.slice(0,-1)},'Oxirgi amal bekor qilindi');}
 if(act==='export'){
   const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`qazo-hisobim-${nowLocalDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 }
 if(act==='reset'){if(confirm('Rostdan ham HAMMA hisoblarni o‘chirmoqchimisiz?')&&confirm('Bu amaldan ortga qaytib bo‘lmaydi. Zaxira olganingizni tekshiring.'))commit(newState(),'Hisob tozalandi');}
});
document.addEventListener('change',async e=>{
 if(e.target?.id==='choosePrayer'){selected=e.target.value;return;}
 if(e.target?.id!=='backupInput')return;
 const f=e.target.files?.[0];if(!f)return;
 try{if(f.size>20000000)throw new Error('Fayl juda katta');const obj=JSON.parse(await f.text());if(!validate(obj))throw new Error('Zaxira fayl noto‘g‘ri yoki hisob izchil emas');
 if(confirm('Hozirgi hisobingizni zaxira fayldagi hisob bilan ALMASHTIRASIZMI? Avval o‘zingiznikidan zaxira nusxa olish tavsiya qilinadi.'))commit({version:1,actions:obj.actions},'Zaxiradan tiklandi');
 }catch(err){alert('Faylni o‘qib bo‘lmadi: '+err.message);}finally{e.target.value='';}
});
render();

  </script>
</body>
