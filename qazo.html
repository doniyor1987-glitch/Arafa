  <noscript>Ilovadan foydalanish uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>
  <script src="./namoz-estimate.js"></script>
  <script>
/* Qazo namozlarim hisobi — account-free, offline-first PWA. No data is sent to a server. */
'use strict';
const KEY = 'qazo_hisobim_local_v1';
const PRAYERS = [
  {id:'bomdod',name:'Bomdod',rakat:2},
  {id:'peshin',name:'Peshin',rakat:4},
  {id:'asr',name:'Asr',rakat:4},
  {id:'shom',name:'Shom',rakat:3},
  {id:'xufton',name:'Xufton',rakat:4},
  {id:'vitr',name:'Vitr',rakat:3}
];
const IDS = PRAYERS.map(x=>x.id);
const blank = () => Object.fromEntries(IDS.map(k=>[k,0]));
const newState = () => ({version:1,actions:[]});
let state = (()=>{try {const raw=localStorage.getItem(KEY); if(!raw)return newState(); const s=JSON.parse(raw); if(validate(s))return s;}catch(_){} return newState();})();
let tab='home', kind='debt', selected='all', years='5', statusText='';

const OWNER_NAME_KEY='arafa_qazo_owner_name_v1';
function normalizeOwnerName(value){return String(value??'').replace(/\s+/g,' ').trim().slice(0,40);}
function readOwnerName(){try{return normalizeOwnerName(localStorage.getItem(OWNER_NAME_KEY));}catch(_){return '';}}
let ownerName=readOwnerName();
function ownerPrompt(){
 if(ownerName)return '';
 return `<div class="card owner-prompt"><h3>Ismingiz</h3><p>Namoz va ro‘za uchun bir marta kiriting.</p><div class="owner-input-row"><input id="ownerName" type="text" maxlength="40" autocomplete="name" placeholder="Ismingiz"><button type="button" data-act="saveOwner" data-source="ownerName">Saqlash</button></div></div>`;
}
function ownerSettings(){
 return `<div class="card owner-settings"><h3>Ismingiz</h3><div class="owner-input-row"><input id="ownerSettingsName" type="text" maxlength="40" autocomplete="name" placeholder="Ismingiz" value="${safeHTML(ownerName)}"><button type="button" data-act="saveOwner" data-source="ownerSettingsName">Saqlash</button></div></div>`;
}

const $ = id => document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('en-US');
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const nowLocalDate=()=>localDate();
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0);}
function evaluate(s){
  const debt=blank(),done=blank();
  for(const a of s.actions){
    if(a.autoDebt===true)for(const [key,value] of Object.entries(a.delta))debt[key]+=value;
    const target=a.type==='debt'?debt:done;
    for(const [key,value] of Object.entries(a.delta))target[key]+=value;
    if(IDS.some(k=>done[k]<0||debt[k]<0||done[k]>debt[k]))throw new Error('Hisob mos emas');
  }
  return {debt,done,remaining:Object.fromEntries(IDS.map(k=>[k,debt[k]-done[k]])),total:sum(debt),completed:sum(done)};
}
function validate(s){
  if(!s||s.version!==1||!Array.isArray(s.actions)||s.actions.length>100000)return false;
  for(const a of s.actions){
    if(!['debt','done'].includes(a.type)||typeof a.at!=='string'||!Number.isFinite(Date.parse(a.at))||!a.delta||typeof a.delta!=='object'||Array.isArray(a.delta))return false;
    const entries=Object.entries(a.delta);
    if(entries.length<1||entries.length>6)return false;
    if(entries.some(([k,v])=>!IDS.includes(k)||!Number.isSafeInteger(v)||Math.abs(v)>10000000||v===0))return false;
    if(a.autoDebt!==undefined&&(a.autoDebt!==true||a.type!=='done'||entries.some(([,v])=>v<=0)))return false;
  }
  try {evaluate(s);return true;} catch(_){return false;}
}
function commit(next,notice){
  if(!validate(next)){alert('Kiritilgan qiymat qoldiqdan oshib ketdi yoki noto‘g‘ri.');return false;}
  try {localStorage.setItem(KEY,JSON.stringify(next));}catch(_){alert('Ma’lumotni saqlab bo‘lmadi. Telefon xotirasini tekshiring.');return false;}
  state=next;statusText=notice||'Saqlandi';render();return true;
}
function record(type,delta,note){
  return commit({...state,actions:[...state.actions,{type,delta,at:new Date().toISOString(),on:nowLocalDate(),note:note||''}]},'Hisob saqlandi');
}
function actionName(a){const p=Object.keys(a.delta);return p.length===6?'Barcha namozlar':p.map(k=>PRAYERS.find(x=>x.id===k)?.name||k).join(', ');}
function timeLabel(iso){return new Date(iso).toLocaleString('uz-UZ',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}

function hasQazoEstimate(){return state.actions.some(a=>a.type==='debt');}
function recordNoEstimate(id){
 if(!IDS.includes(id)||hasQazoEstimate())return false;
 const action={type:'done',delta:{[id]:1},at:new Date().toISOString(),on:nowLocalDate(),autoDebt:true,note:'Rejasiz o‘qilgan qazo'};
 return commit({...state,actions:[...state.actions,action]},'Qazo namoz qayd etildi');
}
let calendarMonth=nowLocalDate().slice(0,7),calendarSelected=nowLocalDate();
function calendarCounts(){
 const stacks=Object.fromEntries(IDS.map(id=>[id,[]]));
 for(const a of state.actions){
  if(a.type!=='done')continue;
  const on=/^\d{4}-\d{2}-\d{2}$/.test(a.on||'')?a.on:localDate(new Date(a.at));
  for(const [id,n] of Object.entries(a.delta)){
   const list=stacks[id];
   if(n>0){list.push({on,n});continue;}
   let undo=-n;
   while(undo>0&&list.length){
    const last=list[list.length-1],take=Math.min(undo,last.n);
    last.n-=take;undo-=take;
    if(last.n===0)list.pop();
   }
  }
 }
 const days={};
 for(const id of IDS)for(const item of stacks[id]){
  const row=days[item.on]||(days[item.on]=blank());
  row[id]+=item.n;
 }
 return days;
}
function calendarMarkup(){
 const [year,month]=calendarMonth.split('-').map(Number);
 const first=new Date(Date.UTC(year,month-1,1));
 const count=new Date(Date.UTC(year,month,0)).getUTCDate();
 const offset=(first.getUTCDay()+6)%7;
 const data=calendarCounts(),today=nowLocalDate();
 const titles=['Du','Se','Cho','Pa','Ju','Sha','Ya'];
 const heading=first.toLocaleDateString('uz-UZ',{month:'long',year:'numeric',timeZone:'UTC'});
 const slots=Array.from({length:offset},()=>'<span class="cal-empty" aria-hidden="true"></span>');
 for(let n=1;n<=count;n++){
  const day=calendarMonth+'-'+String(n).padStart(2,'0'),row=data[day]||blank();
  const filled=IDS.filter(id=>row[id]>0).length;
  const color=filled===6?'green':filled>0?'yellow':'';
  const selected=day===calendarSelected,old=day<=today;
  slots.push(`<button type="button" data-act="calendarDay" data-date="${day}" class="cal-day${selected?' cal-current':''}${day===today?' cal-today':''}" aria-label="${day}: ${filled?filled+' ta namoz turidan o‘qilgan':'qayd yo‘q'}" aria-pressed="${selected}" ${old?'':'disabled'}><span>${n}</span><i class="cal-dot ${color}" aria-hidden="true"></i></button>`);
 }
 const viewing=calendarSelected.startsWith(calendarMonth)?calendarSelected:null;
 const row=viewing?(data[viewing]||blank()):null;
 const filled=row?IDS.filter(id=>row[id]>0).length:0;
 const daily=row?sum(row):0;
 const dayText=viewing?new Date(viewing+'T12:00:00Z').toLocaleDateString('uz-UZ',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'';
 const stats=viewing?`<div class="cal-detail"><div class="cal-detail-head"><strong>${dayText}</strong><span>${filled===6?'To‘liq — 6/6':filled?filled+'/6 tur':'Qayd yo‘q'}</span></div>${daily?`<div class="cal-prayers">${PRAYERS.map(p=>`<span class="${row[p.id]>0?'read':''}">${p.name}: ${fmt(row[p.id])}</span>`).join('')}</div><p>${fmt(daily)} ta qazo namoz qayd etilgan</p>`:'<p>Bu kunda namoz qaydi yo‘q.</p>'}</div>`:'';
 return `<section class="card qazo-calendar"><div class="cal-top"><div><h3>Namozlar kalendari</h3><p>Qaysi kunlari qazo o‘qilganini ko‘ring</p></div></div>
 <div class="cal-switch"><button data-act="calendarPrev" aria-label="Oldingi oy">‹</button><strong>${heading}</strong><button data-act="calendarNext" aria-label="Keyingi oy">›</button></div>
 <div class="cal-days">${titles.map(t=>`<span class="cal-weekday">${t}</span>`).join('')}${slots.join('')}</div>
 <div class="cal-legend"><span><i class="cal-dot green"></i>6/6 — to‘liq</span><span><i class="cal-dot yellow"></i>1–5 — qisman</span><span>Nuqta yo‘q — qayd yo‘q</span></div>
 ${stats}</section>`;
}

function parseCalendarDate(s){

 const ms=Date.parse(s+'T00:00:00Z');if(!Number.isFinite(ms)||new Date(ms).toISOString().slice(0,10)!==s)return null;return ms;
}

function rozaDuration(days){

 <div class="card"><h3>${calcType==='namoz'?'Namoz':'Ro‘za'} hisobi</h3>${calcType==='namoz'?`<p>Jami: ${fmt(count.total)} · O‘qilgan: ${fmt(count.completed)} · Qolgan: <b>${fmt(count.total-count.completed)}</b></p><button class="big-btn secondary" data-act="navigate" data-tab="home">Dashboardga qaytish →</button>`:`<p>Jami: ${fmt(roza.debt)} · Tutilgan: ${fmt(roza.done)} · Qolgan: <b>${fmt(roza.debt-roza.done)}</b></p><div class="calc-roza-actions"><button data-act="rozaMinus" ${roza.done===0?'disabled':''}>−</button><b>${fmt(roza.done)} tutilgan</b><button data-act="rozaPlus" ${roza.done===roza.debt?'disabled':''}>+</button></div>`}</div>`;
}
function history(){const rows=[...state.actions].reverse();return `<div class="section-head"><h2>Harakatlar tarixi</h2><span>${fmt(rows.length)} ta yozuv</span></div><div class="card">${rows.length?rows.slice(0,150).map(a=>`<div class="history-row"><div><div class="history-title">${a.type==='debt'?'Hisobga qo‘shildi / tuzatildi':'O‘qildi / tuzatildi'} · ${actionName(a)}</div><div class="history-sub">${timeLabel(a.at)}</div></div><div class="amount ${a.type==='debt'?'add':'done'}">${sum(a.delta)>0?'+':''}${fmt(sum(a.delta))}</div></div>`).join(''):'<div class="muted">Hozircha yozuv yo‘q.</div>'}</div><button class="big-btn secondary" data-act="undo" ${!rows.length?'disabled':''}>Oxirgi amalni bekor qilish</button><p class="caption">Xato kiritilgan oxirgi amalga qaytishingiz mumkin. Boshqa amalni tuzatish uchun Hisob bo‘limidan foydalaning.</p>`;}
function settings(count){return `<div class="section-head"><h2>Sozlamalar va zaxira</h2></div>
 ${ownerSettings()}
 <div class="card"><h3>Maxfiylik</h3><p>Akkaunt yo‘q. Hisoblar faqat shu qurilmadagi ilova xotirasida turadi. Serverga yuborilmaydi. Boshqa odam ilovani ochsa, uning hisobi noldan boshlanadi.</p><div class="warning">iPhone xotirasi tozalansa yoki ilova ma’lumotlari o‘chirilsa, hisob yo‘qolishi mumkin. Muntazam <b>zaxira nusxa</b> saqlang.</div></div>
 <div class="card"><h3>Zaxira nusxa</h3><p>JSON faylni iPhone’ning Files dasturida saqlashingiz yoki boshqa telefoningizga ko‘chirishingiz mumkin. Zaxira faylni ommaga yubormang.</p><button class="big-btn" data-act="export">Zaxira nusxani yuklab olish</button><label class="big-btn secondary" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Zaxiradan tiklash<input id="backupInput" type="file" accept=".json,application/json" hidden></label></div>
 <div class="card"><h3>Ma’lumotlarni tozalash</h3><p>Jami ${fmt(count.total)} ta boshlang‘ich qazo, ${fmt(count.completed)} ta ado etilgan qazo qaydi mavjud.</p><button class="big-btn danger" data-act="reset">Barcha hisoblarni o‘chirish</button></div>`;}
function render(){const count=evaluate(state);$('app').innerHTML=`<div class="arafa-bar"><a href="./" aria-label="Arafa zikr va duolar sahifasiga qaytish">← Bosh sahifa</a></div><header class="topbar"><div class="brand"><div class="emblem" aria-hidden="true">☾</div><div class="brand-text"><strong>Qazo namozlarim hisobi</strong>${ownerName?`<span class="owner-display">👤 ${safeHTML(ownerName)}</span>`:''}</div></div></header><main>${tab==='home'?home(count):tab==='manage'?manage(count):tab==='history'?history():settings(count)}</main><div class="status" role="status">${statusText}</div><nav class="nav" aria-label="Asosiy menyu">${[['home','⌂','Asosiy'],['manage','⊕','Hisob'],['history','◷','Tarix'],['settings','⚙','Sozlama']].map(([t,ico,label])=>`<button data-act="navigate" data-tab="${t}" class="${tab===t?'active':''}" ${tab===t?'aria-current="page"':''}><strong>${ico}</strong><span>${label}</span></button>`).join('')}</nav>`;}
function ensureAction(type,keys,n){const count=evaluate(state);if(!Number.isSafeInteger(n)||n<=0||n>10000000){alert('1 dan 10 milliongacha butun son kiriting.');return;}
  if(type==='done'&&keys.some(k=>count.remaining[k]<n)){alert('Tanlangan namoz uchun qazo qoldig‘i yetarli emas. Oldin hisobga qo‘shing.');return;}
  if(n>=365&&type==='done'&&!confirm(`DIQQAT: ${keys.length} ta namoz turining HAR BIRIDAN ${fmt(n)} tadan qazo haqiqatan o‘qildimi?`))return;
  if(n>=365&&type==='debt'&&!confirm(`Har bir tanlangan namoz turiga ${fmt(n)} tadan qazo qo‘shilsinmi?`))return;
  record(type,Object.fromEntries(keys.map(k=>[k,n])));
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-act],button[data-kind],button[data-year]');if(!b)return;
 if(b.dataset.kind){kind=b.dataset.kind;statusText='';render();return;}
 if(b.dataset.year){selected=$('choosePrayer')?.value||selected;years=b.dataset.year;statusText='';render();return;}
 const act=b.dataset.act,p=b.dataset.prayer;
 if(act==='saveOwner'){
   const field=$(b.dataset.source),next=normalizeOwnerName(field?.value);
   if(!next){alert('Ismingizni kiriting.');field?.focus();return;}
   try{localStorage.setItem(OWNER_NAME_KEY,next);ownerName=next;statusText='Ism saqlandi';render();}
   catch(_){alert('Ismni saqlab bo‘lmadi. Xotirani tekshiring.');}
   return;
 }
 if(act==='navigate'){selectedPrayer=null;pendingRoza=false;tab=b.dataset.tab;statusText='';render();window.scrollTo(0,0);return;}
 if(act==='selectPrayer'){
   if(tab!=='home'||!PRAYERS.some(x=>x.id===p)||(hasQazoEstimate()&&evaluate(state).remaining[p]<=0))return;
   pendingRoza=false;selectedPrayer=selectedPrayer===p?null:p;statusText='';render();return;
 }
 if(act==='cancelPrayer'){selectedPrayer=null;render();return;}
 if(act==='confirmPrayer'){
   if(tab!=='home'||selectedPrayer!==p||!PRAYERS.some(x=>x.id===p))return;
   if(hasQazoEstimate()&&evaluate(state).remaining[p]<=0){selectedPrayer=null;render();return;}
   selectedPrayer=null;
   if(hasQazoEstimate())ensureAction('done',[p],1);else recordNoEstimate(p);
   return;
 }
 if(act==='calendarPrev'||act==='calendarNext'){
   if(tab!=='home')return;
   const [y,m]=calendarMonth.split('-').map(Number);
   const shift=act==='calendarPrev'?-1:1;
   const newDate=new Date(Date.UTC(y,m-1+shift,1));
   if(newDate.getUTCFullYear()<1900||newDate.getUTCFullYear()>2100)return;
   calendarMonth=newDate.toISOString().slice(0,7);calendarSelected='';render();return;
 }
 if(act==='calendarDay'){
   const day=b.dataset.date;
   if(tab!=='home'||!/^\d{4}-\d{2}-\d{2}$/.test(day)||!day.startsWith(calendarMonth)||day>nowLocalDate())return;
   calendarSelected=day;render();return;
 }
 if(act==='rozaPrepare'){
   if(tab!=='home'||roza.debt-roza.done<=0)return;
   selectedPrayer=null;pendingRoza=true;statusText='';render();return;
 }
 if(act==='rozaCancel'){pendingRoza=false;render();return;}
 if(act==='rozaConfirm'){
   if(tab!=='home'||!pendingRoza||roza.debt-roza.done<=0)return;
   const next={...roza,done:roza.done+1};
   try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;pendingRoza=false;statusText='1 kun qazo ro‘za tutilgani saqlandi';render();}
   catch(e){alert('Ro‘za hisobini saqlab bo‘lmadi.');}
   return;
 }
 if(act==='rozaUndo'){
   if(tab!=='home'||roza.done<=0)return;
   if(!confirm('Oxirgi belgilangan 1 kun ro‘zani bekor qilasizmi? Qolgan qazo 1 kunga ortadi.'))return;
   const next={...roza,done:roza.done-1};
   try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;pendingRoza=false;statusText='Oxirgi ro‘za qaydi bekor qilindi';render();}
   catch(e){alert('Ro‘za hisobini saqlab bo‘lmadi.');}
   return;
 }
 if(act==='goRoza'){tab='manage';calcType='roza';calcPreview=null;render();window.scrollTo(0,0);return;}
 if(act==='calcType'){calcType=b.dataset.value;calcPreview=null;render();return;}
 if(act==='calcMode'){calcMode=b.dataset.value;calcPreview=null;render();return;}

 if(act==='rozaRun'){
   const startText=$('rozaStartYear').value.trim(),endText=$('rozaEndYear').value.trim();
   const start=Number(startText),end=Number(endText),current=new Date().getFullYear();
   if(!/^\d{4}$/.test(startText)||!/^\d{4}$/.test(endText)||!Number.isSafeInteger(start)||!Number.isSafeInteger(end)||start<1900||end>current||start>end||end-start>100){
     alert('Yillarni to‘g‘ri kiriting: balog‘at yili oxirgi yilga teng yoki undan oldin bo‘lishi kerak.');return;
   }
   rozaDraft={startYear:start,endYear:end};
   calcPreview={type:'roza',mode:'years',amount:(end-start+1)*30,startYear:start,endYear:end};
   render();return;
 }
 if(act==='rozaSave'){
   if(!calcPreview||calcPreview.type!=='roza')return;
   const v=calcPreview;
   if(v.amount<roza.done){alert('Yangi jami qazo ilgari tutilgan ro‘za sonidan kam.');return;}
   if(!confirm('Hisobdagi jami ro‘za soni '+fmt(v.amount)+' kunga almashtirilsinmi? Oldin belgilangan tutilgan ro‘zalar saqlanadi.'))return;
   const {name:oldName,...rozaWithoutName}=roza;
   const next={...rozaWithoutName,debt:v.amount,startYear:v.startYear,endYear:v.endYear};
   try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;calcPreview=null;statusText='Ro‘za hisobi saqlandi';render();}
   catch(e){alert('Ro‘za hisobini saqlashda xatolik yuz berdi.');}
   return;
 }
 if(act==='calcRun'){
   try{
     const days=calcMode==='year'?Math.round(Number(namozDraft.calcYears)*365.2425):calcDays(namozDraft.calcFrom,namozDraft.calcTo);
     if(namozDraft.gender==='female'&&['hayzDays','birthCount','nifasDays'].some(k=>namozDraft[k].trim()===''))throw new Error('Ayollar uchun barcha maydonlarni to‘ldiring (yo‘q bo‘lsa 0).');
     const result=estimateNamoz(days,namozDraft.gender,Number(namozDraft.hayzDays),Number(namozDraft.birthCount),Number(namozDraft.nifasDays));
     calcPreview={type:calcType,mode:calcMode,...result};render();
   }catch(error){calcPreview=null;alert(error.message);}
   return;
 }
 if(act==='calcSave'){
   if(!calcPreview||calcPreview.type!==calcType||calcPreview.mode!==calcMode)return;
   if(!confirm('Hisoblangan miqdor joriy JAMI qazo sonini almashtiradi. Oldin qayd etilgan ado amallari saqlanadi. Davom etamizmi?'))return;
   if(calcType==='namoz'){
     const c=evaluate(state),delta={};
     for(const p of PRAYERS){if(calcPreview.amount<c.done[p.id]){alert(p.name+' uchun oldin ado etilgan miqdor yangi hisobdan ko‘p.');return;}const d=calcPreview.amount-c.debt[p.id];if(d!==0)delta[p.id]=d;}
     if(Object.keys(delta).length&&!record('debt',delta,'Kalkulyator bilan yangilandi'))return;
   }else{
     if(calcPreview.amount<roza.done){alert('Tutilgan ro‘za miqdoridan kam hisob saqlanmaydi.');return;}
     const next={...roza,debt:calcPreview.amount};
     try{localStorage.setItem(ROZA_KEY,JSON.stringify(next));roza=next;}catch(e){alert('Saqlash amalga oshmadi.');return;}
   }
   calcPreview=null;statusText='Hisob saqlandi';render();return;
 }
 if(act==='bulk'){selected=$('choosePrayer').value;const q=Number($('bulkQuantity').value);ensureAction(kind,selected==='all'?IDS:[selected],q);}
 if(act==='addPeriod'){
   const start=$('periodStart').value,end=$('periodEnd').value;
   const a=parseCalendarDate(start),b=parseCalendarDate(end);
   if(a===null||b===null||b<a||b>Date.now()||((b-a)/86400000)>36525){alert('To‘g‘ri, o‘tib ketgan sanalar oralig‘ini kiriting (100 yildan oshmasin).');return;}
   if(historyPeriods().some(p=>!(end<p.start||start>p.end))){alert('Bu davr oldin hisoblangan sana bilan kesishadi. Bir davrni qayta qo‘shmang.');return;}
   const days=Math.round((b-a)/86400000)+1,delta={};
   for(const p of PRAYERS){const n=Number($('period-'+p.id).value);if(!Number.isSafeInteger(n)||n<0||n>100){alert('Har bir namoz uchun 0 dan 100 gacha butun foiz yozing.');return;}const estimate=Math.round(days*n/100);if(estimate>0)delta[p.id]=estimate;}
   if(Object.keys(delta).length===0){alert('Barcha foizlar 0: qo‘shiladigan qazo yo‘q.');return;}
   if(confirm(start+' dan '+end+' gacha ('+days+' kun) bo‘yicha taxminiy qazolarni hisobga qo‘shasizmi?'))record('debt',delta,'DAVR|'+start+'|'+end+'|'+days+' kun');
 }
 if(act==='ageEstimate'){
   const from=Number($('ageFrom').value),to=Number($('ageTo').value),pct=Number($('missedPct').value);
   if(!Number.isFinite(from)||!Number.isFinite(to)||!Number.isFinite(pct)||from<1||to>120||to<=from||pct<0||pct>100){alert('Yoshlar oralig‘i va 0–100% ulushni to‘g‘ri kiriting.');return;}
   const number=Math.round((to-from)*365.2425*pct/100);
   if(number<1){alert('Bu davr uchun qazo miqdori 0 ga teng.');return;}
   if(confirm(`${from}–${to} yosh davri uchun 6 turdagi namozning har biriga ${fmt(number)} ta taxminiy qazo qo‘shilsinmi?`))record('debt',Object.fromEntries(IDS.map(id=>[id,number])),`${from}–${to} yosh · ${pct}%`);
 }
 if(act==='manual'){
   const c=evaluate(state),delta={};let bad=false;
   for(const p of PRAYERS){const v=Number($('set-'+p.id).value);if(!Number.isSafeInteger(v)||v<0||v>10000000||v<c.done[p.id]){bad=true;break;}const diff=v-c.debt[p.id];if(diff!==0)delta[p.id]=diff;}
   if(bad){alert('Jami qazo o‘qilgan miqdordan kam bo‘lmasligi va musbat butun son bo‘lishi kerak.');return;}
   if(Object.keys(delta).length===0){statusText='O‘zgarish yo‘q';render();return;}
   if(confirm('Boshlang‘ich qazo miqdorlarini yangilaysizmi?'))record('debt',delta);
 }
 if(act==='undo'){if(state.actions.length&&confirm('Oxirgi amal bekor qilinsinmi?'))commit({...state,actions:state.actions.slice(0,-1)},'Oxirgi amal bekor qilindi');}
 if(act==='export'){
   const blob=new Blob([JSON.stringify({...state,ownerName,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`qazo-hisobim-${nowLocalDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 }
 if(act==='reset'){if(confirm('Rostdan ham HAMMA hisoblarni o‘chirmoqchimisiz?')&&confirm('Bu amaldan ortga qaytib bo‘lmaydi. Zaxira olganingizni tekshiring.'))commit(newState(),'Hisob tozalandi');}
});
document.addEventListener('input',e=>{
 if(Object.prototype.hasOwnProperty.call(namozDraft,e.target.id)){
   namozDraft[e.target.id]=e.target.value;calcPreview=null;$('namozResult')?.remove();
 }
});
document.addEventListener('change',async e=>{
 if(e.target.id==='namozGender'){namozDraft.gender=e.target.value;calcPreview=null;render();return;}

 if(e.target?.id==='choosePrayer'){selected=e.target.value;return;}
 if(e.target?.id!=='backupInput')return;
 const f=e.target.files?.[0];if(!f)return;
 try{if(f.size>20000000)throw new Error('Fayl juda katta');const obj=JSON.parse(await f.text());if(!validate(obj))throw new Error('Zaxira fayl noto‘g‘ri yoki hisob izchil emas');
 if(confirm('Hozirgi hisobingizni zaxira fayldagi hisob bilan ALMASHTIRASIZMI? Avval o‘zingiznikidan zaxira nusxa olish tavsiya qilinadi.')){
   if(commit({version:1,actions:obj.actions},'Zaxiradan tiklandi')&&typeof obj.ownerName==='string'){
     const saved=normalizeOwnerName(obj.ownerName);
     if(saved){try{localStorage.setItem(OWNER_NAME_KEY,saved);ownerName=saved;render();}catch(_){alert('Namoz hisobi tiklandi, lekin ismni saqlashda xatolik bo‘ldi.');}}
   }
 }
 }catch(err){alert('Faylni o‘qib bo‘lmadi: '+err.message);}finally{e.target.value='';}
});
render();

  </script>
